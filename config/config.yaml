# -------- Core IO --------
data_location: "/data/cephfs-1/scratch/groups/sanders/kiwi_tmp/BRDU-OP-ADCR11/ADCR11/bam"
output_location: "/data/cephfs-1/scratch/groups/sanders/kiwi_tmp/BRDU-OP-ADCR11/bamqc"

# -------- Reference --------
ref: "hg38"  # or "mm10", "T2T"
reference_path: "$HOME/work/mosaicatcher-pipeline-BIH/workflow/data/ref_genomes"
window: 200000
chromosomes: "1-22,X,Y"  # use "all" for every contig in the reference FASTA index
bam_ext: ".sort.mdup.bam"
tmp_dir: "$TMPDIR"

# BAM-dependent job resources use this threshold for small/large profiles.
large_bam_threshold_mb: 800
bam_resources:
  alfred_qc:
    small: {partition: short, mem_mb: 8000, time: "01:00:00"}
    large: {partition: medium, mem_mb: 16000, time: "1-00:00:00"}
  coverage_counts:
    small: {partition: short, mem_mb: 12000, time: "01:00:00"}
    large: {partition: medium, mem_mb: 32000, time: "1-00:00:00"}
  preseq_lc:
    small: {partition: short, mem_mb: 8000, time: "01:00:00"}
    large: {partition: medium, mem_mb: 16000, time: "1-00:00:00"}
# -------- Plots --------
plot: False

# -------- External Ashley launcher (Option A) --------
ashleys:
  enabled: true
  bin: "$HOME/work/ashleys-qc/bin/ashleys.py"
  model_path: "$HOME/work/ashleys-qc/models/svc_default.pkl"
  win_sizes: [5000000,2000000,1000000,800000,600000,400000,200000]
  threads: 32
  mem_mb: 200000
  conda_env: "envs/ashleys.yaml"
